[project]
name = "gemma-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "bcrypt",
    "itsdangerous",
    "email-validator",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
